name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          cd "learning - journal/movies_project"
          pip install flake8 black

      - name: Install dependencies
        run: |
          cd "learning - journal/movies_project"
          pip install -r requirements.txt
          pip install pytest
          pip install httpx
          
      - name: Run tests
        run: |
          cd "learning - journal/movies_project"
          pytest tests/test_movies.py -v

      - name: Run linters
        run: |
          cd "learning - journal/movies_project"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check .

  build-docker:
    needs: test  # Этот job запустится только если тесты прошли
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./learning - journal/movies_project
          file: ./learning - journal/movies_project/Dockerfile
          push: true
          tags: ghcr.io/ar1emcoder/movies-api:latest